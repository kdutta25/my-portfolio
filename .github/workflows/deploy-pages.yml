name: Deploy Pages

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-deploy
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Checkout my-portfolio-api data
        uses: actions/checkout@v4
        with:
          repository: kdutta25/my-portfolio-api
          path: _content-api

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - run: npm ci

      - name: Configure content API URL for build
        env:
          SECRET_BASE: ${{ secrets.VITE_CONTENT_API_BASE_URL }}
          VAR_BASE: ${{ vars.VITE_CONTENT_API_BASE_URL }}
        run: |
          node <<'NODE'
          const fs = require("fs");
          const gh = process.env.GITHUB_ENV;
          const raw = (process.env.SECRET_BASE || process.env.VAR_BASE || "").trim();
          const pagesOrigin = "https://www.kaustubhdutta.com";
          const hosts = new Set(["www.kaustubhdutta.com", "kaustubhdutta.com"]);
          let base = pagesOrigin;
          if (raw) {
            try {
              const u = new URL(raw.replace(/\/+$/, ""));
              const p = (u.pathname || "").replace(/\/+$/, "");
              if (hosts.has(u.hostname) && (p === "" || p === "/")) {
                base = u.origin;
              } else {
                console.log(
                  "::warning::Ignoring VITE_CONTENT_API_BASE_URL (not the GitHub Pages site origin). Using " +
                    pagesOrigin +
                    " so the SPA loads generated /v1 JSON.",
                );
              }
            } catch {
              console.error("::error::VITE_CONTENT_API_BASE_URL (secret or variable) must be a valid URL");
              process.exit(1);
            }
          } else {
            console.log(
              "::notice::No VITE_CONTENT_API_BASE_URL secret or variable — using " +
                pagesOrigin +
                " with same-origin /v1.",
            );
          }
          fs.appendFileSync(gh, `VITE_CONTENT_API_BASE_URL=${base}\n`);
          fs.appendFileSync(gh, "VITE_ALLOW_SAME_ORIGIN_CONTENT_API=true\n");
          NODE

      - name: Verify content API base is set for Vite build
        run: |
          if [ -z "${VITE_CONTENT_API_BASE_URL:-}" ]; then
            echo "::error::VITE_CONTENT_API_BASE_URL is missing after the configure step. Check .github/workflows/deploy-pages.yml."
            exit 1
          fi
          echo "VITE_CONTENT_API_BASE_URL is set (value hidden)."

      - name: Generate static /v1 content
        env:
          CONTENT_DATA_DIR: _content-api/data
        run: npm run generate:static-content

      - name: Build
        env:
          VITE_BASE_PATH: ${{ vars.VITE_BASE_PATH }}
          CONTENT_DATA_DIR: _content-api/data
        run: npm run build

      - uses: actions/configure-pages@v4

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      - id: deployment
        uses: actions/deploy-pages@v4
